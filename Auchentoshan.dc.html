    // Video carousel: thumbnails carry the clip and its shape; the player above shows it whole.
    this.applySound = () => { const v = this.player; if (v) { v.volume = this.state.volume; v.muted = this.state.muted; } };
    this.startPlay = (v) => {
      if (!v) return;
      this.applySound();
      const pr = v.play();
      if (pr && pr.catch) pr.catch(() => { v.muted = true; this.setState({ muted: true }); const p2 = v.play(); if (p2 && p2.catch) p2.catch(() => {}); });
    };
    this.setPlayer = (el) => { this.player = el; if (el) { el.volume = this.state.volume; el.muted = this.state.muted; } };
    this.playVideo = () => this.startPlay(this.player);
    this.showVideo = (btn) => {
      const track = btn && btn.closest('[data-vreel]');
      if (!track) return;
      const all = Array.from(track.querySelectorAll('button'));
      all.forEach((b) => b.removeAttribute('data-on'));
      btn.setAttribute('data-on', '');
      const v = btn.querySelector('video');
      const src = v ? (v.getAttribute('src') || '') : '';
      const ratio = btn.getAttribute('data-ratio') || '16 / 9';
      this.setState({ video: { src, ratio, n: all.indexOf(btn) + 1, total: all.length } });
    };
    this.pickVideo = (e) => this.showVideo(e.currentTarget);
    this.toggleSound = () => {
      const muted = !this.state.muted;
      const volume = !muted && this.state.volume === 0 ? 0.6 : this.state.volume;
      this.setState({ muted, volume }, () => { this.applySound(); if (this.player && this.player.paused) this.startPlay(this.player); });
    };
    this.setVolume = (e) => {
      const volume = Math.max(0, Math.min(1, Number(e.target.value) / 100));
      this.setState({ volume, muted: volume === 0 }, this.applySound);
    };
    this.syncSound = (e) => {
      const v = e.currentTarget;
      if (v.muted !== this.state.muted || Math.abs(v.volume - this.state.volume) > 0.001) {
        this.setState({ muted: v.muted, volume: v.volume }, this.applySound);
      }
    };

    const trackOf = (node) => { const box = node && node.closest('[data-group], section'); return box ? box.querySelector('[data-reel], [data-vreel]') : null; };
    const move = (e, dir) => {
      const el = trackOf(e.currentTarget);
      if (!el) return;
      if (el.getAttribute('data-dir') === 'y') el.scrollBy({ top: dir * el.clientHeight * 0.8, behavior: 'smooth' });
      else el.scrollBy({ left: dir * el.clientWidth * 0.8, behavior: 'smooth' });
    };
    this.swipePrev = (e) => move(e, -1);
    this.swipeNext = (e) => move(e, 1);
    this.show = (btn) => {
      const track = btn && btn.closest('[data-reel]');
      const img = btn && btn.querySelector('img');
      if (!track || !img) return;
      const all = Array.from(track.querySelectorAll('button'));
      all.forEach((b) => b.removeAttribute('data-on'));
      btn.setAttribute('data-on', '');
      const id = track.getAttribute('data-reel');
      const entry = { src: img.getAttribute('src') || '', alt: img.getAttribute('alt') || '', n: all.indexOf(btn) + 1, total: all.length };
      this.setState((st) => ({ reels: { ...st.reels, [id]: entry } }));
    };
    this.pickThumb = (e) => this.show(e.currentTarget);
    // Wheel sync: scrolling a thumbnail strip with the mouse wheel moves the strip and updates the big preview.
    this.wheelSync = (el) => {
      if (!el || el.__wheelSync) return;
      el.__wheelSync = true;
      const vertical = () => el.getAttribute('data-dir') === 'y';
      let raf = 0;
      const pick = () => {
        raf = 0;
        const btns = Array.from(el.querySelectorAll('button'));
        if (!btns.length) return;
        const cs = getComputedStyle(el);
        const y = vertical();
        const pad = parseFloat(y ? (cs.scrollPaddingTop || cs.paddingTop) : (cs.scrollPaddingLeft || cs.paddingLeft)) || 0;
        const box = el.getBoundingClientRect();
        const focus = (y ? box.top : box.left) + pad;
        const atEnd = y ? el.scrollTop + el.clientHeight >= el.scrollHeight - 2 : el.scrollLeft + el.clientWidth >= el.scrollWidth - 2;
        let best = btns[0], dist = Infinity;
        btns.forEach((b) => { const r = b.getBoundingClientRect(); const d = Math.abs((y ? r.top : r.left) - focus); if (d < dist) { dist = d; best = b; } });
        if (atEnd && dist > 24) best = btns[btns.length - 1];
        if (!best.hasAttribute('data-on')) this.show(best);
      };
      el.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(pick); }, { passive: true });
      el.addEventListener('wheel', (e) => {
        if (vertical() || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
        const max = el.scrollWidth - el.clientWidth;
        if ((e.deltaY > 0 && el.scrollLeft < max - 1) || (e.deltaY < 0 && el.scrollLeft > 1)) { e.preventDefault(); el.scrollLeft += e.deltaY; }
      }, { passive: false });
    };
    const _setSwipe = this.setSwipe;
    this.setSwipe = (el) => { _setSwipe(el); if (el && el.hasAttribute('data-reel')) this.wheelSync(el); };
    this.flavorZh = () => this.setState({ flavorLang: 'zh' });
    this.flavorEn = () => this.setState({ flavorLang: 'en' });
    this.state.banner = 0;
    this.state.bannerCount = 0;
    this.setBanner = (el) => { this.bannerEl = el; };
    this.slideCount = () => (this.bannerEl ? this.bannerEl.children.length : 0);
    this.goBanner = (i) => {
      const n = this.slideCount() || 1;
      this.setState({ banner: ((i % n) + n) % n, bannerCount: this.slideCount() });
    };
    this.syncBanner = () => {
      const n = this.slideCount();
      if (n !== this.state.bannerCount) {
        this.setState({ bannerCount: n, banner: Math.min(this.state.banner || 0, Math.max(n - 1, 0)) });
        this.bannerMeasure();
      }
      const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (n > 1 && !still && !this.timer) this.timer = setInterval(this.tick, 4000);
    };
    this.tick = () => { this.bannerMeasure(); if (!this.paused) this.goBanner(this.state.banner + 1); };
    this.state.bannerRatio = '4 / 3';
    this.bannerMeasure = () => {
      const box = this.bannerEl;
      if (!box) return;
      let best = 0;
      box.querySelectorAll('img').forEach((im) => {
        if (im.naturalWidth && im.naturalHeight) {
          const r = im.naturalHeight / im.naturalWidth;
          if (r > best) best = r;
        }
      });
      if (best) {
        const ratio = '1 / ' + best.toFixed(4);
        if (ratio !== this.state.bannerRatio) this.setState({ bannerRatio: ratio });
      }
    };
    this.bannerPause = () => { this.paused = true; };
    this.bannerResume = () => { this.paused = false; };
  }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); if (this.bannerObs) this.bannerObs.disconnect(); }
  componentDidMount() {
    Object.keys(this.tracks).forEach((id) => {
      const first = this.tracks[id].querySelector('button');
      if (first) this.show(first);
    });
    const vfirst = this.vtrack && this.vtrack.querySelector('button');
    if (vfirst) this.showVideo(vfirst);
    this.bannerMeasure();
    this.syncBanner();
    if (this.bannerEl && window.MutationObserver) {
      this.bannerObs = new MutationObserver(() => { this.syncBanner(); this.bannerMeasure(); });
      this.bannerObs.observe(this.bannerEl, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
    }
  }
  componentDidUpdate() { this.syncBanner(); }
  renderVals() {
    const view = (id) => {
      const r = this.state.reels[id] || {};
      return { has: !!r.src, src: r.src || '', alt: r.alt || '', count: r.total ? r.n + ' / ' + r.total : '' };
    };
    const p = this.props;
    const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
    const glass = {
      x: num(p.glassX, 50) + '%', y: num(p.glassY, 50) + '%', scale: num(p.glassScale, 1),
      blur: num(p.glassBlur, 22), tint: num(p.glassTint, 10) / 100
    };
    const fz = this.state.flavorLang !== 'en';
    const flavor = {
      zh: this.flavorZh, en: this.flavorEn,
      zhOn: fz, enOn: !fz,
      zhBg: fz ? '#ffffff' : 'transparent', zhFg: fz ? '#3a0d12' : 'rgba(255,255,255,0.8)',
      enBg: !fz ? '#ffffff' : 'transparent', enFg: !fz ? '#3a0d12' : 'rgba(255,255,255,0.8)'
    };
    const bi = this.state.banner || 0;
    const banner = {
      shift: 'translateY(-' + (bi * 100) + '%)', ratio: this.state.bannerRatio,
      dots: Array.from({ length: this.state.bannerCount || 0 }, (_, k) => ({
        n: k + 1, pressed: k === bi ? 'true' : 'false',
        h: k === bi ? '22px' : '8px', bg: k === bi ? '#ffffff' : 'rgba(255,255,255,0.55)',
        pick: () => this.goBanner(k)
      }))
    };
    const vv = this.state.video || {};
    const tall = (() => { const q = String(vv.ratio || '16 / 9').split('/').map(Number); return q[1] > q[0]; })();
    const vshown = {
      has: !!vv.src, empty: !vv.src, src: vv.src || '',
      count: vv.total ? vv.n + ' / ' + vv.total : '',
      ratio: vv.ratio || '16 / 9',
      w: tall ? 'min(100%, 480px)' : '100%'
    };
    const muted = this.state.muted;
    const sound = {
      muted, on: !muted, pressed: muted ? 'false' : 'true',
      label: muted ? 'Turn sound on' : 'Turn sound off',
      pct: Math.round((muted ? 0 : this.state.volume) * 100)
    };
    return {
      flavor, banner, bannerRef: this.setBanner, bannerMeasure: this.bannerMeasure, bannerPause: this.bannerPause, bannerResume: this.bannerResume,
      vshown, sound, playerRef: this.setPlayer, playVideo: this.playVideo, pickVideo: this.pickVideo,
      toggleSound: this.toggleSound, setVolume: this.setVolume, syncSound: this.syncSound,
      glass, heroRef: this.setHero, playHero: this.playHero,
      shown0: view('0'), shown1: view('1'), shown2: view('2'),
      pickThumb: this.pickThumb, swipeRef: this.setSwipe, swipePrev: this.swipePrev, swipeNext: this.swipeNext,
      tone: this.props.tone ?? '#14352c'
    };
  }
}
</script>
